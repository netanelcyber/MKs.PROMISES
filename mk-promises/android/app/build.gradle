plugins {
    id 'com.android.application'
}

android {
    namespace 'il.mkpromises'
    compileSdk 34

    defaultConfig {
        applicationId 'il.mkpromises'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '0.1'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

}

dependencies {
    // On-device LLM runtime (runs a model file the user provides; nothing is sent to the cloud)
    implementation 'com.google.mediapipe:tasks-genai:0.10.14'
}
