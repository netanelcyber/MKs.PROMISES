<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f4e79">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>מעקב הבטחות</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#1c2430;--mute:#5d6b7a;--line:#dfe4ea;--brand:#1f4e79;--brand-ink:#fff;--ok:#1b7a43;--part:#8a5d00;--bad:#b3261e;--na:#5d6b7a;--coal:#5b3a9a;--chip:#eef2f6}
@media (prefers-color-scheme:dark){:root{--bg:#11151a;--card:#1a2027;--ink:#e8ecf1;--mute:#9aa7b5;--line:#2b343e;--brand:#6fa8dc;--brand-ink:#0e1419;--ok:#5fcf8a;--part:#e0b04a;--bad:#ff8a80;--na:#9aa7b5;--coal:#b79cf0;--chip:#232b34}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Hebrew",Arial,sans-serif}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:5;background:var(--brand);color:var(--brand-ink);padding:12px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
header h1{font-size:18px;margin:0;flex:1;min-width:0}
header button{background:transparent;color:inherit;border:1px solid rgba(255,255,255,.5);border-radius:8px;padding:6px 10px;font:inherit;font-size:14px}
main{padding:16px;max-width:720px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:0 0 12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
h2{font-size:17px;margin:20px 0 8px}
h3{font-size:16px;margin:0 0 4px}
.mute{color:var(--mute);font-size:14px}
.chip{display:inline-block;background:var(--chip);border-radius:999px;padding:2px 10px;font-size:13px;margin:2px 0 2px 4px}
.chip.ok{color:var(--ok)}.chip.part{color:var(--part)}.chip.bad{color:var(--bad)}.chip.na{color:var(--na)}.chip.coal{color:var(--coal)}
.chip.new{background:var(--brand);color:var(--brand-ink)}
button,select,input,textarea{font:inherit;color:var(--ink)}
button.pri{background:var(--brand);color:var(--brand-ink);border:0;border-radius:10px;padding:10px 14px}
button.sec{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
button.lnk{background:none;border:0;color:var(--brand);padding:4px 6px;text-decoration:underline}
button.danger{color:var(--bad)}
button:disabled{opacity:.55;cursor:not-allowed}
input,select,textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px}
textarea{min-height:84px;resize:vertical}
label{display:block;font-size:14px;color:var(--mute);margin:10px 0 4px}
label.chk{display:flex;gap:8px;align-items:center;color:var(--ink)}
label.chk input{width:auto}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);width:min(92vw,520px);padding:16px}
dialog::backdrop{background:rgba(0,0,0,.45)}
.ev{border-inline-start:3px solid var(--line);padding:4px 10px;margin:6px 0}
.ev.support{border-color:var(--ok)}.ev.contradict{border-color:var(--bad)}
a{color:var(--brand);word-break:break-all}
.note{font-size:13px;color:var(--mute);margin-top:24px;border-top:1px solid var(--line);padding-top:12px}
.api-error{border-inline-start:4px solid var(--bad)}
.api-error .mute{overflow-wrap:anywhere}
.api-error details{margin-top:10px}
.api-error pre{direction:ltr;text-align:left;white-space:pre-wrap;overflow-wrap:anywhere;max-height:240px;overflow:auto;font-size:12px;user-select:text}
.protocol-text{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;max-height:45vh;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:10px;user-select:text}
.protocol-quote{white-space:pre-wrap;overflow-wrap:anywhere;border-inline-start:3px solid var(--line);padding:6px 10px;margin:8px 0}
button:disabled{opacity:.55;cursor:wait}
#toast{position:fixed;inset-inline:16px;bottom:calc(16px + env(safe-area-inset-bottom));background:#222;color:#fff;border-radius:10px;padding:10px 14px;display:none;z-index:20}
</style>
</head>
<body>
<header>
  <button id="backBtn" hidden aria-label="חזרה">→ חזרה</button>
  <h1 id="title">מעקב הבטחות</h1>
  <button data-a="protocolSettings">פרוטוקולים</button>
  <button data-a="menu">⋮ גיבוי</button>
</header>
<main id="app"></main>
<div id="toast" role="status"></div>
<dialog id="dlg"><form method="dialog" id="dlgForm"></form></dialog>

<script src="promise-scoring.js"></script>
<script src="stance-model.js"></script>
<script>
(function(){
'use strict';
var BASE='https://knesset.gov.il/OdataV4/ParliamentInfo/';
var KEY='mk-promises-v1';
var STATUS={unchecked:['לא נבדק','na'],kept:['קוימה','ok'],partial:['קוימה חלקית','part'],broken:['לא קוימה','bad'],unmeasurable:['לא ניתנת למדידה','na'],coalition:['הוגבלה בהסכם קואליציוני','coal']};
var EFFECT={support:'מקדם את ההבטחה',contradict:'סותר את ההבטחה',context:'הקשר'};
var EVTYPE=['הצעת חוק','הצבעה','נאום / התבטאות','ועדה','אחר'];
var ELECTION={'2022':'בחירות 2022 (הכנסת ה-25)','2026':'בחירות 2026 (הכנסת ה-26)',other:'אחר'};
var PROTOCOL_SETTINGS_KEY='mk-promises-protocol-settings-v1',PROTOCOL_RESPONSE_LIMIT=524288;
var protocolSettings=loadProtocolSettings(),protocolToken='',protocolSession=null;
var protocolNativePending=Object.create(null),protocolNativeId=0;
var recoveryBackup=null,loadWarning='';
var S=load();
var view={name:'list'};
var F={q:'',faction:'',onlyNew:false};
var bills=Object.create(null); // mkId -> loaded bills
var apiFailure=null; // Temporary diagnostics only; never part of saved records or backups.
var API_ACTIONS=['members','bills','committees','allbills'];

function uid(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]})}
function normalizeState(value){
  function record(o){if(!o||typeof o!=='object'||Array.isArray(o))throw new Error('רשומה לא תקינה');return o}
  function text(o,k,required){
    var v=o[k];if(v==null)v='';
    if(typeof v!=='string'||(required&&!v.trim()))throw new Error('שדה לא תקין: '+k);
    return v;
  }
  function url(o,k){var v=text(o,k);if(v&&!okUrl(v))throw new Error('קישור לא תקין');return v}
  function choice(o,k,options,fallback){var v=text(o,k)||fallback;if(!Object.prototype.hasOwnProperty.call(options,v))throw new Error('ערך לא תקין: '+k);return v}
  function entries(items,convert){
    if(items==null)return[];
    if(!Array.isArray(items))throw new Error('רשימה לא תקינה');
    var ids=new Set();
    return items.map(function(item){
      record(item);var id=item.id;
      if(id==null||id==='')id=uid();
      if(typeof id==='number'&&Number.isFinite(id))id=String(id);
      if(typeof id!=='string'||!id.trim()||ids.has(id))throw new Error('מזהה חסר או כפול');
      ids.add(id);return convert(item,id);
    });
  }
  record(value);
  if(!Array.isArray(value.mks)||(value.v!=null&&value.v!==1))throw new Error('גיבוי לא נתמך');
  return{v:1,mks:entries(value.mks,function(m,id){
    if(m.isNew!=null&&typeof m.isNew!=='boolean')throw new Error('סימון חבר כנסת לא תקין');
    var k=m.knesset==null?'':m.knesset;
    if(typeof k==='number'&&Number.isFinite(k))k=String(k);
    if(typeof k!=='string')throw new Error('מספר כנסת לא תקין');
    var member={id:id,name:text(m,'name',true),faction:text(m,'faction'),knesset:k,isNew:m.isNew===true,
      promises:entries(m.promises,function(p,pid){var promise={id:pid,text:text(p,'text',true),topic:text(p,'topic'),sourceUrl:url(p,'sourceUrl'),sourceDate:text(p,'sourceDate'),status:choice(p,'status',STATUS,'unchecked'),note:text(p,'note'),
        evidence:entries(p.evidence,function(e,eid){var evidence={id:eid,title:text(e,'title',true),type:text(e,'type')||'אחר',effect:choice(e,'effect',EFFECT,'context'),date:text(e,'date'),url:url(e,'url')};
          if(e.excerpt!=null)evidence.excerpt=boundedProtocolString(text(e,'excerpt'),4000);
          if(e.protocol!=null){evidence.protocol=validateProtocolMetadata(e.protocol);if(!evidence.excerpt||evidence.type!=='ועדה'||officialProtocolUrl(evidence.url)!==evidence.protocol.sourceUrl)throw new Error('ראיית פרוטוקול אינה תקינה')}
          return evidence})};
        if(p.election!=null&&p.election!=='')promise.election=choice(p,'election',ELECTION,'other');
        if(p.war!=null){if(typeof p.war!=='boolean')throw new Error('סימון מלחמה לא תקין');if(p.war)promise.war=true}
        return promise}),
      background:entries(m.background,function(b,bid){return{id:bid,title:text(b,'title',true),period:text(b,'period'),url:url(b,'url'),note:text(b,'note')}})};
    if(m.apiPersonId!=null&&m.apiPersonId!==''){
      var personId=apiId(m.apiPersonId);
      if(!personId)throw new Error('מזהה הכנסת לא תקין');
      member.apiPersonId=personId;
    }
    return member;
  })};
}
function load(){
  var raw=null;
  try{raw=localStorage.getItem(KEY);if(raw!==null)return normalizeState(JSON.parse(raw))}
  catch(e){
    if(raw!==null){recoveryBackup=raw;loadWarning='לא ניתן לפתוח את הנתונים השמורים. בתפריט גיבוי אפשר לייצא את המקור לפני ייבוא גיבוי תקין או מחיקת הנתונים. המקור נשמר ללא שינוי.'}
    else loadWarning='אין גישה לשמירה המקומית. אפשר לעבוד ולייצא גיבוי, אך השינויים עלולים לא להישמר במכשיר.';
  }
  return{v:1,mks:[]};
}
function save(nextState){
  var replace=arguments.length>0;
  if(recoveryBackup!==null&&!replace){toast('יש לייצא את הגיבוי הקודם ולשחזר את הנתונים דרך תפריט גיבוי');return false}
  try{localStorage.setItem(KEY,JSON.stringify(replace?nextState:S));if(replace)recoveryBackup=null;loadWarning='';return true}
  catch(e){toast('השמירה המקומית נכשלה. ייצאו גיבוי כדי לשמור את השינויים');return false}
}
function mk(id){return S.mks.find(function(m){return m.id===id})}
function toast(t){var el=document.getElementById('toast');el.textContent=t;el.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(function(){el.style.display='none'},3500)}
function okUrl(u){try{if(typeof u!=='string'||!/^https?:\/\//i.test(u)||/\s/.test(u))return false;var parsed=new URL(u);return /^https?:$/.test(parsed.protocol)&&!!parsed.hostname}catch(e){return false}}
function link(u){return okUrl(u)?'<a href="'+esc(u)+'" target="_blank" rel="noopener">'+esc(u.replace(/^https?:\/\//,'').slice(0,60))+'</a>':''}

/* ---------- explicit committee-protocol reader ---------- */
function officialProtocolUrl(value){
  if(typeof value!=='string'||!value||value.length>4096||/\s/.test(value))throw new Error('נדרש קישור HTTPS רשמי של הכנסת');
  var u;try{u=new URL(value)}catch(e){throw new Error('קישור המקור אינו תקין')}
  if(u.protocol!=='https:'||u.username||u.password||(u.port&&u.port!=='443')||!(u.hostname==='knesset.gov.il'||u.hostname.endsWith('.knesset.gov.il')))throw new Error('אפשר לקרוא רק קישורי HTTPS רשמיים תחת knesset.gov.il, ללא פרטי גישה או יציאה מותאמת');
  u.hash='';if(u.href.length>4096)throw new Error('קישור המקור ארוך מדי לאחר קידוד');return u.href;
}
function protocolServiceUrl(value){
  if(typeof value!=='string'||value.length>2048)throw new Error('כתובת השירות אינה תקינה');
  value=value.trim();if(!value)return'';
  var u;try{u=new URL(value)}catch(e){throw new Error('יש להזין כתובת שירות מלאה')}
  var loopback=u.hostname==='localhost'||u.hostname==='127.0.0.1'||u.hostname==='[::1]';
  if(/\s/.test(value)||u.username||u.password||u.search||u.hash||!(u.protocol==='https:'||(u.protocol==='http:'&&loopback)))throw new Error('נדרש שירות HTTPS; HTTP מותר רק ב-localhost לפיתוח בדפדפן');
  var endpoint=u.origin+u.pathname.replace(/\/+$/,'');if(endpoint.length>2048)throw new Error('כתובת השירות ארוכה מדי');return endpoint;
}
function loadProtocolSettings(){
  try{var value=JSON.parse(localStorage.getItem(PROTOCOL_SETTINGS_KEY)||'{}');return{endpoint:protocolServiceUrl(value.endpoint||'')}}catch(e){return{endpoint:''}}
}
function boundedProtocolString(value,max,nullable){
  if(nullable&&value===null)return null;
  if(typeof value!=='string'||value.length>max*2||Array.from(value).length>max)throw new Error('שדה בתשובת הפרוטוקול אינו תקין');
  return value;
}
function validateProtocolMetadata(value){
  if(!value||typeof value!=='object'||Array.isArray(value)||['html','pdf','docx','doc'].indexOf(value.kind)<0)throw new Error('פרטי הפרוטוקול אינם תקינים');
  var retrievedAt=boundedProtocolString(value.retrievedAt,80);
  if(!/^\d{4}-\d{2}-\d{2}T/.test(retrievedAt)||!Number.isFinite(Date.parse(retrievedAt)))throw new Error('זמן קריאת הפרוטוקול אינו תקין');
  return{sourceUrl:officialProtocolUrl(value.sourceUrl),title:boundedProtocolString(value.title,300),committee:boundedProtocolString(value.committee,200,true),date:boundedProtocolString(value.date,80,true),retrievedAt:retrievedAt,kind:value.kind};
}
function validateProtocolResult(value,expectedUrl){
  if(!value||typeof value!=='object'||Array.isArray(value)||['page','html','pdf','docx','doc'].indexOf(value.kind)<0||typeof value.isProtocol!=='boolean'||typeof value.truncated!=='boolean'||(value.kind==='page'&&value.isProtocol)||!Array.isArray(value.documents)||value.documents.length>50||!Array.isArray(value.warnings)||value.warnings.length>8)throw new Error('תשובת שירות הפרוטוקולים אינה תקינה');
  var sourceUrl=officialProtocolUrl(value.sourceUrl),finalUrl=officialProtocolUrl(value.finalUrl);
  if(sourceUrl!==officialProtocolUrl(expectedUrl))throw new Error('כתובת המקור בתשובה אינה תואמת לבקשה');
  var result={sourceUrl:sourceUrl,finalUrl:finalUrl,title:boundedProtocolString(value.title,300),committee:boundedProtocolString(value.committee,200,true),date:boundedProtocolString(value.date,80,true),text:boundedProtocolString(value.text,100000),kind:value.kind,isProtocol:value.isProtocol,truncated:value.truncated,retrievedAt:boundedProtocolString(value.retrievedAt,80),documents:[],warnings:[]};
  if(result.isProtocol&&!result.text.trim())throw new Error('לא התקבל טקסט קריא מהפרוטוקול');
  if(!/^\d{4}-\d{2}-\d{2}T/.test(result.retrievedAt)||!Number.isFinite(Date.parse(result.retrievedAt)))throw new Error('זמן הקריאה בתשובה אינו תקין');
  result.documents=value.documents.map(function(doc){
    if(!doc||typeof doc!=='object'||['pdf','docx','doc','html'].indexOf(doc.format)<0)throw new Error('קישור מסמך בתשובה אינו תקין');
    return{url:officialProtocolUrl(doc.url),title:boundedProtocolString(doc.title,300),format:doc.format};
  });
  result.warnings=value.warnings.map(function(warning){return boundedProtocolString(warning,300)});
  return result;
}
function showProtocolSettings(){
  return ask('שירות קריאת פרוטוקולים',[
    {k:'endpoint',label:'כתובת בסיס של שירות הקריאה (אופציונלי)',type:'url',value:protocolSettings.endpoint},
    {k:'token',label:'אסימון גישה לשירות (אופציונלי; בזיכרון בלבד)',type:'password',value:protocolToken}
  ],'שמירת הגדרות',{
    intro:'נדרש שרת קריאה שהוגדר עם Selenium. הקריאה מתחילה רק אחרי בחירת מקור ולחיצה על ״קריאה״; אין שרת ציבורי מוגדר כברירת מחדל.',
    content:'<p class="mute">השירות מקבל רק את קישור המקור הרשמי. הוא קורא דף או מסמך ומחזיר טקסט מקור, ללא סיכום או קביעה שחבר כנסת מסוים דיבר. דף דיון אינו נחשב לפרוטוקול: בוחרים קישור למסמך וקוראים אותו בנפרד.</p><p class="mute">כתובת השירות נשמרת במכשיר בנפרד מהגיבוי. אסימון הגישה נשאר בזיכרון עד סגירת העמוד ואינו נשמר או מיוצא. השירות משתמש ב-<span dir="ltr">/api/protocols</span>. ב-APK נדרש HTTPS; בפיתוח בדפדפן אפשר HTTP ב-localhost והגדרת CORS מתאימה בשרת.</p><p class="mute"><a href="https://main.knesset.gov.il/Activity/committees/pages/allcommitteeprotocols.aspx" target="_blank" rel="noopener">מאגר הפרוטוקולים הרשמי של הכנסת</a></p>',
    validate:function(o){try{protocolServiceUrl(o.endpoint);if(!/^[\x21-\x7e]{0,512}$/.test(o.token))return'אסימון השירות חייב להכיל עד 512 תווי ASCII גלויים, ללא רווחים'}catch(e){return e.message}}
  }).then(function(o){
    if(!o)return false;protocolSettings={endpoint:protocolServiceUrl(o.endpoint)};protocolToken=o.token;
    try{localStorage.setItem(PROTOCOL_SETTINGS_KEY,JSON.stringify(protocolSettings));toast('הגדרות השירות נשמרו; האסימון נשאר בזיכרון בלבד')}catch(e){toast('ההגדרות זמינות לעמוד הנוכחי בלבד; השמירה המקומית נכשלה')}
    return true;
  });
}
function protocolHttpError(status,body){
  var detail='';try{var parsed=JSON.parse(body);if(parsed&&parsed.error&&typeof parsed.error.message==='string')detail=parsed.error.message.slice(0,600)}catch(e){}
  if(detail)return detail;
  if(status===401||status===403)return'שירות הקריאה דחה את הגישה. בדקו את ההרשאות, אסימון השירות וקישור המקור';
  if(status===413)return'המסמך או תשובת השירות גדולים מדי';
  if(status===422)return'לא ניתן לחלץ טקסט מהמסמך; ייתכן שנדרש OCR או שהמסמך מוגן';
  if(status===503)return'שירות הקריאה אינו זמין או עסוק. נסו שוב בהמשך';
  if(status===504)return'שירות הקריאה חרג מזמן ההמתנה למקור';
  return status?'שירות הקריאה החזיר שגיאה HTTP '+status:'לא ניתן להתחבר לשירות קריאת הפרוטוקולים';
}
function readProtocolResponse(response){
  if(response.headers&&Number(response.headers.get('content-length'))>PROTOCOL_RESPONSE_LIMIT)return Promise.reject(new Error('תשובת שירות הקריאה גדולה מדי'));
  if(response.body&&response.body.getReader){
    var reader=response.body.getReader(),decoder=new TextDecoder(),parts=[],size=0;
    function step(){return reader.read().then(function(chunk){
      if(chunk.done)return parts.join('')+decoder.decode();size+=chunk.value.byteLength;
      if(size>PROTOCOL_RESPONSE_LIMIT){reader.cancel();throw new Error('תשובת שירות הקריאה גדולה מדי')}
      parts.push(decoder.decode(chunk.value,{stream:true}));return step();
    })}return step();
  }
  return response.text().then(function(text){if(text.length>PROTOCOL_RESPONSE_LIMIT||new TextEncoder().encode(text).length>PROTOCOL_RESPONSE_LIMIT)throw new Error('תשובת שירות הקריאה גדולה מדי');return text});
}
window.__protocolNativeDone=function(id,ok,status,b64){
  var pending=protocolNativePending[id];if(!pending)return;
  try{
    if(typeof b64!=='string'||b64.length>Math.ceil(PROTOCOL_RESPONSE_LIMIT/3)*4+4)throw new Error('תשובת השירות גדולה מדי');

  return fetchAll(BASE+'KNS_PersonToPosition?$filter=KnessetNum eq '+k+' and (PositionID eq 43 or PositionID eq 61 or PositionID eq 54)&$select=PersonID,PositionID,FactionName,IsCurrent,StartDate',3000).then(function(pos){

        var faction=(factions[apiId(p.Id)]||{}).FactionName;

      });
      if(S!==state)return;

        var id=apiId(p.Id);if(seen[id])return;seen[id]=true;

      });

    });
  }).catch(function(e){if(S===state)reportApiError('members',e,{k:k})});
}

var dialogActive=false;
function ask(title,fields,okLabel,options){
  if(dialogActive)return Promise.resolve(null);
  dialogActive=true;options=options||{};
  return new Promise(function(resolve){
    var dlg=document.getElementById('dlg'),f=document.getElementById('dlgForm');
    var result=null;
    var h='<h3>'+esc(title)+'</h3>';
    if(options.intro)h+='<p class="mute">'+esc(options.intro)+'</p>';
    if(options.content)h+=options.content;
    fields.forEach(function(x){
      var v=x.value==null?'':x.value,req=x.required?' required':'';
      if(x.type==='checkbox'){h+='<label class="chk"><input type="checkbox" name="'+x.k+'"'+(v?' checked':'')+req+'> '+esc(x.label)+'</label>';return}
      h+='<label for="f_'+x.k+'">'+esc(x.label)+(x.required?' *':'')+'</label>';
      if(x.type==='select'){h+='<select id="f_'+x.k+'" name="'+x.k+'">'+x.options.map(function(o){return'<option value="'+esc(o[0])+'"'+(o[0]===v?' selected':'')+'>'+esc(o[1])+'</option>'}).join('')+'</select>'}
      else if(x.type==='textarea'){h+='<textarea id="f_'+x.k+'" name="'+x.k+'"'+req+'>'+esc(v)+'</textarea>'}
      else{h+='<input id="f_'+x.k+'" name="'+x.k+'" type="'+(x.type||'text')+'" value="'+esc(v)+'"'+req+(x.type==='url'?' inputmode="url" placeholder="https://…"':'')+(x.type==='password'?' autocomplete="off" spellcheck="false"':'')+'>'}
    });
    h+='<div class="row" style="margin-top:14px"><button class="pri" value="ok">'+esc(okLabel||'שמירה')+'</button><button class="sec" value="cancel" formnovalidate>ביטול</button></div>';
    f.innerHTML=h;
    f.onsubmit=function(ev){
      ev.preventDefault();
      var sub=ev.submitter;
      if(!sub&&document.activeElement&&document.activeElement.tagName==='BUTTON')sub=document.activeElement;
      if(sub&&sub.value==='cancel'){dlg.close('cancel');return}
      var o={};fields.forEach(function(x){var el=f.elements[x.k];o[x.k]=x.type==='checkbox'?el.checked:(el.value||'').trim()});
      for(var i=0;i<fields.length;i++){
        var x=fields[i];
        if(x.required&&!o[x.k]){toast('יש למלא את השדה: '+x.label);f.elements[x.k].focus();return}
        if(x.type==='url'&&o[x.k]&&!okUrl(o[x.k])){toast('הקישור חייב להתחיל ב-http:// או ב-https://');f.elements[x.k].focus();return}
      }
      if(options.validate){var message=options.validate(o);if(message){toast(message);return}}
      result=o;dlg.close('ok')};
    // A close event can arrive after submit. Resolve only here so a chained
    // prompt cannot receive the previous dialog's close event.
    dlg.onclose=function(){f.onsubmit=null;dlg.onclose=null;dialogActive=false;resolve(result)};
    dlg.returnValue='';
    if(options.onOpen)options.onOpen(f);
    dlg.showModal();
  });
}

    function end(message,failure){

      resolve();

    var l=e.toLowerCase();

var STANCE_PREFIX='ובכלמהש';

function stanceScore(model,promise,utterance){
  var cfg=model.cfg,W=model.W,dim=cfg.dim,H=cfg.lstm_hidden;
  var p=stanceTokens(promise).slice(0,40),u=stanceTokens(utterance).slice(0,160);
  var toks=p.concat(['[sep]'],u),seg=[],i,j;
  for(i=0;i<p.length+1;i++)seg.push(0);for(i=0;i<u.length;i++)seg.push(1);
  var emb=W['enc.emb.weight'],sg=W['enc.seg.weight'];
  var seq=toks.map(function(t,ti){
    var ids=stanceFeats(t,cfg.buckets,14),x=new Float32Array(dim);
    for(var a=0;a<ids.length;a++){var row=ids[a]*dim;for(var d=0;d<dim;d++)x[d]+=emb[row+d]}
    for(var d2=0;d2<dim;d2++)x[d2]=x[d2]/ids.length+sg[seg[ti]*dim+d2];
    return x;
  });
  for(var layer=0;layer<cfg.lstm_layers;layer++){
    var f=lstmDir(W,layer,false,seq,H),b=lstmDir(W,layer,true,seq,H);
    seq=f.map(function(v,t){var o=new Float32Array(2*H);o.set(v);o.set(b[t],H);return o});
  }
  var T=seq.length,a=new Float32Array(T),mx=-Infinity,aw=W['att.weight'],ab=W['att.bias'][0];
  for(i=0;i<T;i++){var sc=ab;for(j=0;j<2*H;j++)sc+=aw[j]*seq[i][j];a[i]=sc;if(sc>mx)mx=sc}
  var z=0;for(i=0;i<T;i++){a[i]=Math.exp(a[i]-mx);z+=a[i]}
  var att=new Float32Array(2*H),mp=new Float32Array(2*H).fill(-Infinity);
  for(i=0;i<T;i++)for(j=0;j<2*H;j++){att[j]+=a[i]/z*seq[i][j];if(seq[i][j]>mp[j])mp[j]=seq[i][j]}
  var x2=new Float32Array(4*H);x2.set(att);x2.set(mp,2*H);
  for(i=0;i<cfg.dnn.length;i++){
    x2=linear(W,'head.'+(4*i),x2);for(j=0;j<x2.length;j++)x2[j]=gelu(x2[j]);x2=layerNorm(W,'head.'+(4*i+2),x2);
  }
  var lg=linear(W,'head.'+(4*cfg.dnn.length),x2),m=Math.max.apply(null,lg),e=Array.prototype.map.call(lg,function(v){return Math.exp(v-m)}),s=e.reduce(function(p2,q){return p2+q},0);
  return e.map(function(v){return v/s});
}

var STANCE=null,STANCE_DB='mk-promises-model',STANCE_LABEL={support:'תומך',contradict:'סותר',context:'הקשר'};
function idb(mode,fn){
  return new Promise(function(res,rej){
    try{
      var open=indexedDB.open(STANCE_DB,1);
      open.onupgradeneeded=function(){open.result.createObjectStore('m')};
      open.onerror=function(){rej(open.error)};
      open.onsuccess=function(){var tx=open.result.transaction('m',mode),req=fn(tx.objectStore('m'));tx.oncomplete=function(){res(req&&req.result)};tx.onerror=function(){rej(tx.error)}};
    }catch(e){rej(e)}
  });
}
function stanceReady(){
  if(STANCE)return Promise.resolve(STANCE);
  return idb('readonly',function(st){return st.get('model')}).then(function(text){
    if(!text)return null;
    try{STANCE=stanceLoad(JSON.parse(text))}catch(e){return null}
    return STANCE;
  },function(){return null}).then(function(m){
    if(m||!window.__STANCE_BUNDLED)return m;
    try{STANCE=stanceLoad(window.__STANCE_BUNDLED)}catch(e){return null}   // the model bundled with the app
    return STANCE;
  });
}
function stanceFromText(text){
  var model=stanceLoad(JSON.parse(text));STANCE=model;
  return idb('readwrite',function(st){return st.put(text,'model')}).catch(function(){}).then(function(){return model});
}
function stancePick(){
  var input=document.createElement('input');input.type='file';input.accept='.json,application/json';
  input.onchange=function(){
    var f=input.files&&input.files[0];if(!f)return;
    var r=new FileReader();
    r.onload=function(){stanceFromText(String(r.result)).then(function(m){toast('המודל נטען'+(m.synthetic?' (אומן על נתונים סינתטיים בלבד)':''))},function(e){toast('טעינת המודל נכשלה: '+String((e&&e.message)||e).slice(0,100))})};
    r.onerror=function(){toast('קריאת הקובץ נכשלה')};
    r.readAsText(f);
  };
  input.click();
}

function scoreMarkup(subject,member){
  var result;try{var engine=window.MKPromiseScoring;result=engine&&(member?engine.scoreMember(subject):engine.scorePromise(subject))}catch(e){}
  if(!result||result.value===null||!Number.isInteger(result.value)||result.value<0||result.value>255)return'<div class="mute">אין עדיין ציון מבוסס ראיות'+(member&&result?' · כיסוי '+esc(result.scored)+'/'+esc(result.total)+' הבטחות':'')+'</div>'+(result&&!member?'<div class="mute">'+esc(result.reason)+'</div>':'');

}

    ],'שיוך',{intro:'חברות בוועדה אינה אמירה או פעולה של חבר הכנסת. השיוך מוסיף ראיה מקושרת בלבד ואינו משנה סטטוס.'}).then(function(o){
      if(!o||m.promises.indexOf(p)<0)return;var cid=apiId(o.c);if(!cid)return;
      p.evidence=p.evidence||[];p.evidence.push({id:uid(),title:'ועדה: '+cmtName(cid),type:'ועדה',effect:o.effect,date:'',url:BASE+'KNS_Committee('+cid+')'});
      var saved=save();render();if(saved)toast('נוסף');
    });
  },
  menu:function(){menu()}
};
function mkForm(m){
  ask(m?'עריכת חבר כנסת':'הוספת חבר כנסת',[{k:'name',label:'שם',value:m&&m.name,required:true},{k:'faction',label:'סיעה / מפלגה',value:m&&m.faction},{k:'knesset',label:'מספר הכנסת',type:'number',value:m?m.knesset:26},{k:'isNew',label:'חדש בכנסת ה-26',type:'checkbox',value:m&&m.isNew}]).then(function(o){
    if(!o)return;
    if(m){m.name=o.name;m.faction=o.faction;m.knesset=o.knesset;m.isNew=o.isNew}
    else{var n={id:uid(),name:o.name,faction:o.faction,knesset:o.knesset,isNew:o.isNew,promises:[],background:[]};S.mks.push(n);view={name:'mk',id:n.id}}
    save();render()})}
function promiseForm(m,p){
  ask(p?'עריכת הבטחה':'הבטחה חדשה',[{k:'text',label:'נוסח ההבטחה',type:'textarea',value:p&&p.text,required:true},{k:'topic',label:'נושא',value:p&&p.topic},{k:'sourceUrl',label:'קישור למקור',type:'url',value:p&&p.sourceUrl,required:true},{k:'sourceDate',label:'תאריך המקור',type:'date',value:p&&p.sourceDate},{k:'election',label:'מערכת בחירות',type:'select',options:Object.keys(ELECTION).map(function(k){return[k,ELECTION[k]]}),value:p?(p.election||'other'):'2022'},{k:'war',label:'ההבטחה הושפעה מהמלחמה (מאז 7.10.2023)',type:'checkbox',value:p&&p.war},{k:'status',label:'סטטוס',type:'select',options:statusOpts(),value:p?p.status:'unchecked'},{k:'note',label:'הערה',type:'textarea',value:p&&p.note}]).then(function(o){
    if(!o)return;
    if(p){Object.assign(p,o)}else{o.id=uid();o.evidence=[];m.promises.push(o)}
    save();render()})}
function evForm(m,pid){
  ask('ראיה לפעילות',[{k:'title',label:'תיאור',required:true},{k:'type',label:'סוג',type:'select',options:EVTYPE.map(function(t){return[t,t]})},{k:'effect',label:'השפעה על ההבטחה',type:'select',options:[['support',EFFECT.support],['contradict',EFFECT.contradict],['context',EFFECT.context]]},{k:'date',label:'תאריך',type:'date'},{k:'url',label:'קישור למקור',type:'url',required:true}]).then(function(o){
    if(!o)return;var p=m.promises.find(function(x){return x.id===pid});o.id=uid();p.evidence=p.evidence||[];p.evidence.push(o);save();render()})}
function resetView(){view={name:'list'};F={q:'',faction:'',onlyNew:false};bills=Object.create(null);protocolSession=null}
function downloadBackup(text){
  var url=URL.createObjectURL(new Blob([text],{type:'application/json'})),a=document.createElement('a');
  a.href=url;a.download='mk-promises.json';document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(url)},1000);
}
/* Manual labels for ml/train.py: every piece of evidence you attached with a chosen effect becomes one labelled pair. */
function labelRows(state,knesset){
  var rows=[];
  state.mks.forEach(function(m){
    if(knesset&&String(m.knesset)!==String(knesset))return;
    m.promises.forEach(function(p){
      (p.evidence||[]).forEach(function(e){
        if(e.effect!=='support'&&e.effect!=='contradict'&&e.effect!=='context')return;
        var text=e.excerpt||e.title;if(!text||!p.text)return;
        rows.push({promise:p.text,utterance:text,label:e.effect,group:m.name,source:e.url||''});
      });
    });
  });
  return rows;
}
function shareOut(t){
  if(window.Android&&window.Android.shareText)window.Android.shareText(t);
  else if(navigator.share){try{navigator.share({title:'מעקב הבטחות',text:t}).catch(function(e){if(e.name!=='AbortError')downloadBackup(t)})}catch(e){downloadBackup(t)}}
  else downloadBackup(t);
}
function menu(){
  ask('גיבוי ושחזור',[{k:'act',label:'פעולה',type:'select',options:[['export','ייצוא / שיתוף הנתונים'],['labels','ייצוא תיוגים לאימון המודל (הכנסת ה-25)'],['import','ייבוא מקובץ JSON שהודבק'],['wipe','מחיקת כל הנתונים']]}],'המשך').then(function(o){
    if(!o)return;
    if(o.act==='labels'){var rows=labelRows(S,25);
      if(!rows.length){toast('אין עדיין ראיות מתויגות של חברי הכנסת ה-25');return}
      shareOut(rows.map(function(r){return JSON.stringify(r)}).join('\n'));toast('יוצאו '+rows.length+' תיוגים');return}
    if(o.act==='export'){var t=recoveryBackup!==null?recoveryBackup:JSON.stringify(S,null,2);
      if(window.Android&&window.Android.shareText)window.Android.shareText(t);
      else if(navigator.share){try{navigator.share({title:'מעקב הבטחות',text:t}).catch(function(e){if(e.name!=='AbortError')downloadBackup(t)})}catch(e){downloadBackup(t)}}
      else downloadBackup(t)}
    else if(o.act==='import'){ask('הדביקו JSON',[{k:'json',label:'תוכן הגיבוי',type:'textarea',required:true}],'ייבוא').then(function(x){
      if(!x)return;var j;
      try{j=normalizeState(JSON.parse(x.json))}catch(e){toast('ה-JSON אינו תקין');return}
      confirmAction('להחליף את הנתונים הנוכחיים?').then(function(yes){if(!yes||!save(j))return;S=j;resetView();render()})})}
    else if(o.act==='wipe'){confirmAction('למחוק הכול? אי אפשר לשחזר.').then(function(yes){if(!yes)return;var empty={v:1,mks:[]};if(!save(empty))return;S=empty;resetView();wipeCaches();render()})}})}

/* ---------- events ---------- */
document.addEventListener('click',function(ev){var t=ev.target.closest('[data-a]');if(!t||t.tagName==='SELECT')return;var f=A[t.dataset.a];if(f){f(t.dataset)}});
document.addEventListener('change',function(ev){var t=ev.target;
  if(t.dataset&&t.dataset.a==='status'){var p=mk(t.dataset.id).promises.find(function(x){return x.id===t.dataset.p});p.status=t.value;save();render();return}
  if(t.id==='fac'){F.faction=t.value;renderItems()}if(t.id==='onlyNew'){F.onlyNew=t.checked;renderItems()}});
document.addEventListener('input',function(ev){if(ev.target.id==='q'){F.q=ev.target.value;renderItems()}if(ev.target.id==='bq'){BQ=ev.target.value;renderBillItems()}});
function navigateBack(){
  if(view.name==='cmt'){view={name:'cmts'};render();return true}
  if(view.name==='mk'||view.name==='cmts'||view.name==='bills'){view={name:'list'};render();return true}
  return false;
}
document.getElementById('backBtn').addEventListener('click',function(){if(!navigateBack()){view={name:'list'};render()}});
window.__back=function(){var dlg=document.getElementById('dlg');if(dlg.open){dlg.close('cancel');return true}return navigateBack()};
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){navigator.serviceWorker.register('sw.js').catch(function(){})}
render();
})();
</script>
