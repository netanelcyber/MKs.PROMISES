<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f4e79">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>מעקב הבטחות</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#1c2430;--mute:#5d6b7a;--line:#dfe4ea;--brand:#1f4e79;--brand-ink:#fff;--ok:#1b7a43;--part:#8a5d00;--bad:#b3261e;--na:#5d6b7a;--coal:#5b3a9a;--chip:#eef2f6}
@media (prefers-color-scheme:dark){:root{--bg:#11151a;--card:#1a2027;--ink:#e8ecf1;--mute:#9aa7b5;--line:#2b343e;--brand:#6fa8dc;--brand-ink:#0e1419;--ok:#5fcf8a;--part:#e0b04a;--bad:#ff8a80;--na:#9aa7b5;--coal:#b79cf0;--chip:#232b34}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Hebrew",Arial,sans-serif}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:5;background:var(--brand);color:var(--brand-ink);padding:12px 16px;display:flex;align-items:center;gap:10px}
header h1{font-size:18px;margin:0;flex:1}
header button{background:transparent;color:inherit;border:1px solid rgba(255,255,255,.5);border-radius:8px;padding:6px 10px;font:inherit;font-size:14px}
main{padding:16px;max-width:720px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:0 0 12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
h2{font-size:17px;margin:20px 0 8px}
h3{font-size:16px;margin:0 0 4px}
.mute{color:var(--mute);font-size:14px}
.chip{display:inline-block;background:var(--chip);border-radius:999px;padding:2px 10px;font-size:13px;margin:2px 0 2px 4px}
.chip.ok{color:var(--ok)}.chip.part{color:var(--part)}.chip.bad{color:var(--bad)}.chip.na{color:var(--na)}.chip.coal{color:var(--coal)}
.chip.new{background:var(--brand);color:var(--brand-ink)}
button,select,input,textarea{font:inherit;color:var(--ink)}
button.pri{background:var(--brand);color:var(--brand-ink);border:0;border-radius:10px;padding:10px 14px}
button.sec{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
button.lnk{background:none;border:0;color:var(--brand);padding:4px 6px;text-decoration:underline}
button.danger{color:var(--bad)}
input,select,textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px}
textarea{min-height:84px;resize:vertical}
label{display:block;font-size:14px;color:var(--mute);margin:10px 0 4px}
label.chk{display:flex;gap:8px;align-items:center;color:var(--ink)}
label.chk input{width:auto}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);width:min(92vw,520px);padding:16px}
dialog::backdrop{background:rgba(0,0,0,.45)}
.ev{border-inline-start:3px solid var(--line);padding:4px 10px;margin:6px 0}
.ev.support{border-color:var(--ok)}.ev.contradict{border-color:var(--bad)}
a{color:var(--brand);word-break:break-all}
.note{font-size:13px;color:var(--mute);margin-top:24px;border-top:1px solid var(--line);padding-top:12px}
#toast{position:fixed;inset-inline:16px;bottom:calc(16px + env(safe-area-inset-bottom));background:#222;color:#fff;border-radius:10px;padding:10px 14px;display:none;z-index:20}
</style>
</head>
<body>
<header>
  <button id="backBtn" hidden aria-label="חזרה">→ חזרה</button>
  <h1 id="title">מעקב הבטחות</h1>
  <button data-a="menu">⋮ גיבוי</button>
</header>
<main id="app"></main>
<div id="toast" role="status"></div>
<dialog id="dlg"><form method="dialog" id="dlgForm"></form></dialog>

<script>
(function(){
'use strict';
var BASE='https://knesset.gov.il/OdataV4/ParliamentInfo/';
var KEY='mk-promises-v1';
var STATUS={unchecked:['לא נבדק','na'],kept:['קוימה','ok'],partial:['קוימה חלקית','part'],broken:['לא קוימה','bad'],unmeasurable:['לא ניתנת למדידה','na'],coalition:['הוגבלה בהסכם קואליציוני','coal']};
var EFFECT={support:'מקדם את ההבטחה',contradict:'סותר את ההבטחה',context:'הקשר'};
var EVTYPE=['הצעת חוק','הצבעה','נאום / התבטאות','ועדה','אחר'];
var S=load();
var view={name:'list'};
var F={q:'',faction:'',onlyNew:false};
var bills={}; // mkId -> loaded bills

function uid(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]})}
function load(){try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);if(o&&Array.isArray(o.mks))return o}}catch(e){}return{v:1,mks:[]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('השמירה המקומית נכשלה')}}
function mk(id){return S.mks.find(function(m){return m.id===id})}
function toast(t){var el=document.getElementById('toast');el.textContent=t;el.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(function(){el.style.display='none'},3500)}
function okUrl(u){return /^https?:\/\/[^\s]+$/i.test(u||'')}
function link(u){return okUrl(u)?'<a href="'+esc(u)+'" target="_blank" rel="noopener">'+esc(u.replace(/^https?:\/\//,'').slice(0,60))+'</a>':''}

/* ---------- network: native bridge on Android, fetch in browser ---------- */
var pending={},nid=0;
window.__nativeDone=function(id,ok,status,b64){var p=pending[id];delete pending[id];if(!p)return;
  if(!ok){p.rej(new Error('HTTP '+status));return}
  try{p.res(new TextDecoder().decode(Uint8Array.from(atob(b64),function(c){return c.charCodeAt(0)})))}catch(e){p.rej(e)}};
function getText(url){
  if(window.Android&&window.Android.httpGet){return new Promise(function(res,rej){var id=++nid;pending[id]={res:res,rej:rej};window.Android.httpGet(id,url)})}
  return fetch(url,{headers:{Accept:'application/json'}}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.text()});
}
function getJson(url){return getText(encodeURI(url)).then(JSON.parse)}
function fetchAll(url,max){var out=[];
  function step(u){return getJson(u).then(function(j){out=out.concat(j.value||[]);
    if(j['@odata.nextLink']&&out.length<max)return step(j['@odata.nextLink']);return out})}
  return step(url)}
function chunks(a,n){var r=[];for(var i=0;i<a.length;i+=n)r.push(a.slice(i,i+n));return r}

function loadMembers(k){
  toast('טוען חברי כנסת…');
  return fetchAll(BASE+'KNS_PersonToPosition?$filter=KnessetNum eq '+k+' and PositionID eq 43&$select=PersonID,FactionName,IsCurrent',3000).then(function(pos){
    var byId={};pos.forEach(function(p){if(!byId[p.PersonID]||p.IsCurrent)byId[p.PersonID]=p});
    var ids=Object.keys(byId);
    return Promise.all(chunks(ids,30).map(function(c){
      return getJson(BASE+'KNS_Person?$filter='+c.map(function(i){return'PersonID eq '+i}).join(' or ')+'&$select=PersonID,FirstName,LastName&$top=100').then(function(j){return j.value||[]})
    })).then(function(parts){
      var added=0;
      [].concat.apply([],parts).forEach(function(p){
        if(S.mks.some(function(m){return m.apiPersonId===p.PersonID}))return;
        S.mks.push({id:uid(),name:((p.FirstName||'')+' '+(p.LastName||'')).trim(),faction:(byId[p.PersonID]||{}).FactionName||'',knesset:k,isNew:false,apiPersonId:p.PersonID,promises:[],background:[]});added++});
      save();render();toast('נוספו '+added+' חברי כנסת');
    });
  }).catch(function(e){toast('הטעינה מה-API נכשלה ('+e.message+'). אפשר להוסיף ידנית.')});
}
function loadBills(m){
  if(!m.apiPersonId){toast('לחבר הכנסת הזה אין מזהה API');return}
  toast('טוען הצעות חוק…');
  fetchAll(BASE+'KNS_BillInitiator?$filter=PersonID eq '+m.apiPersonId+'&$select=BillID,IsInitiator&$top=100',300).then(function(ini){
    var ids=ini.filter(function(x){return x.IsInitiator!==false}).map(function(x){return x.BillID});
    return Promise.all(chunks(ids,25).map(function(c){
      return getJson(BASE+'KNS_Bill?$filter='+c.map(function(i){return'BillID eq '+i}).join(' or ')+'&$select=BillID,KnessetNum,Name,SubTypeDesc&$top=100').then(function(j){return j.value||[]})
    }));
  }).then(function(parts){bills[m.id]=[].concat.apply([],parts);render();toast('נטענו '+bills[m.id].length+' הצעות')})
  .catch(function(e){toast('הטעינה נכשלה ('+e.message+')')});
}

/* ---------- dialogs ---------- */
function ask(title,fields,okLabel){
  return new Promise(function(resolve){
    var dlg=document.getElementById('dlg'),f=document.getElementById('dlgForm');
    var h='<h3>'+esc(title)+'</h3>';
    fields.forEach(function(x){
      var v=x.value==null?'':x.value,req=x.required?' required':'';
      if(x.type==='checkbox'){h+='<label class="chk"><input type="checkbox" name="'+x.k+'"'+(v?' checked':'')+'> '+esc(x.label)+'</label>';return}
      h+='<label for="f_'+x.k+'">'+esc(x.label)+(x.required?' *':'')+'</label>';
      if(x.type==='select'){h+='<select id="f_'+x.k+'" name="'+x.k+'">'+x.options.map(function(o){return'<option value="'+esc(o[0])+'"'+(o[0]===v?' selected':'')+'>'+esc(o[1])+'</option>'}).join('')+'</select>'}
      else if(x.type==='textarea'){h+='<textarea id="f_'+x.k+'" name="'+x.k+'"'+req+'>'+esc(v)+'</textarea>'}
      else{h+='<input id="f_'+x.k+'" name="'+x.k+'" type="'+(x.type||'text')+'" value="'+esc(v)+'"'+req+(x.type==='url'?' inputmode="url" placeholder="https://…"':'')+'>'}
    });
    h+='<div class="row" style="margin-top:14px"><button class="pri" value="ok">'+esc(okLabel||'שמירה')+'</button><button class="sec" value="cancel" formnovalidate>ביטול</button></div>';
    f.innerHTML=h;
    f.onsubmit=function(ev){
      var sub=ev.submitter&&ev.submitter.value;
      if(sub!=='ok'){resolve(null);return}
      var o={};fields.forEach(function(x){var el=f.elements[x.k];o[x.k]=x.type==='checkbox'?el.checked:(el.value||'').trim()});
      for(var i=0;i<fields.length;i++){var x=fields[i];if(x.type==='url'&&o[x.k]&&!okUrl(o[x.k])){ev.preventDefault();toast('הקישור חייב להתחיל ב-https://');return}}
      resolve(o)};
    dlg.onclose=function(){resolve(null)};
    dlg.showModal();
  });
}
function statusOpts(){return Object.keys(STATUS).map(function(k){return[k,STATUS[k][0]]})}

/* ---------- views ---------- */
function chip(st){var s=STATUS[st]||STATUS.unchecked;return'<span class="chip '+s[1]+'">'+esc(s[0])+'</span>'}
function counts(m){var c={};m.promises.forEach(function(p){c[p.status]=(c[p.status]||0)+1});
  return Object.keys(STATUS).filter(function(k){return c[k]}).map(function(k){return'<span class="chip '+STATUS[k][1]+'">'+esc(STATUS[k][0])+' · '+c[k]+'</span>'}).join('')}

function render(){
  var app=document.getElementById('app'),back=document.getElementById('backBtn'),title=document.getElementById('title');
  if(view.name==='mk'&&mk(view.id)){back.hidden=false;title.textContent=mk(view.id).name;app.innerHTML=renderMk(mk(view.id))}
  else if(view.name==='cmts'){back.hidden=false;title.textContent='ועדות הכנסת ה-25';app.innerHTML=renderCmts()}
  else if(view.name==='bills'){back.hidden=false;title.textContent='כל הצעות החוק';app.innerHTML=renderBills();renderBillItems()}
  else if(view.name==='cmt'&&S.cmt){back.hidden=false;title.textContent=cmtName(view.id);app.innerHTML=renderCmt(view.id)}
  else{view={name:'list'};back.hidden=true;title.textContent='מעקב הבטחות';app.innerHTML=renderListShell();renderItems()}
}
function renderListShell(){
  var factions=Array.from(new Set(S.mks.map(function(m){return m.faction}).filter(Boolean))).sort();
  var h='<div class="row" style="margin-bottom:12px"><button class="pri" data-a="addMk">+ הוספת ח"כ</button><button class="sec" data-a="loadMembers">טעינה מהכנסת (ה-25)</button><button class="sec" data-a="openCmts">ועדות הכנסת ה-25</button><button class="sec" data-a="openBills">כל הצעות החוק</button></div>';
  if(S.mks.length){
    h+='<div class="card"><input id="q" type="search" placeholder="חיפוש לפי שם" value="'+esc(F.q)+'">'
     +'<div class="row" style="margin-top:8px"><select id="fac" class="grow"><option value="">כל הסיעות</option>'+factions.map(function(f){return'<option'+(F.faction===f?' selected':'')+'>'+esc(f)+'</option>'}).join('')+'</select>'
     +'<label class="chk" style="margin:0"><input type="checkbox" id="onlyNew"'+(F.onlyNew?' checked':'')+'> חדשים בכנסת ה-26</label></div></div>';
  }
  h+='<div id="items"></div>';
  h+='<div class="note">המידע באפליקציה מוזן על ידי המשתמש. לכל הבטחה ולכל ראיה נדרש קישור למקור, ואין ציון מסכם: הסטטוס נקבע לכל הבטחה בנפרד, ואותה תבנית חלה על כל חברי הכנסת.</div>';
  return h;
}
function renderItems(){
  var el=document.getElementById('items');if(!el)return;
  var q=F.q.toLowerCase();
  var list=S.mks.filter(function(m){return(!q||m.name.toLowerCase().indexOf(q)>=0)&&(!F.faction||m.faction===F.faction)&&(!F.onlyNew||m.isNew)});
  if(!S.mks.length){el.innerHTML='<div class="card"><h3>מתחילים</h3><p class="mute">הוסיפו חבר כנסת ידנית, או טענו את רשימת הכנסת ה-25 מה-API הרשמי. לכל חבר כנסת מוסיפים הבטחות עם מקור, ואחר כך ראיות מהפעילות שלו: הצעות חוק, הצבעות ונאומים.</p><p class="mute">כדי לתעד חברי כנסת חדשים לפני ההשבעה, סמנו "חדש בכנסת ה-26" והוסיפו להם פעילות ציבורית קודמת עם מקור.</p></div>';return}
  if(!list.length){el.innerHTML='<p class="mute">לא נמצאו תוצאות.</p>';return}
  el.innerHTML=list.map(function(m){
    return'<div class="card" data-a="open" data-id="'+m.id+'" style="cursor:pointer"><div class="row"><h3 class="grow">'+esc(m.name)+'</h3>'+(m.isNew?'<span class="chip new">חדש</span>':'')+'</div>'
     +'<div class="mute">'+esc(m.faction||'ללא סיעה')+' · הכנסת ה-'+esc(m.knesset||'')+' · '+m.promises.length+' הבטחות</div><div>'+counts(m)+'</div></div>'}).join('');
}
function renderMk(m){
  var h='<div class="card"><div class="row"><div class="grow"><div class="mute">'+esc(m.faction||'ללא סיעה')+' · הכנסת ה-'+esc(m.knesset||'')+(m.isNew?' · חדש':'')+'</div><div>'+(counts(m)||'<span class="mute">אין עדיין הבטחות</span>')+'</div></div>'
   +'<button class="sec" data-a="editMk" data-id="'+m.id+'">עריכה</button></div></div>';
  h+='<div class="row"><h2 class="grow">הבטחות</h2><button class="pri" data-a="addPromise" data-id="'+m.id+'">+ הבטחה</button></div>';
  if(!m.promises.length)h+='<p class="mute">הוסיפו הבטחה עם קישור למקור שבו נאמרה (מצע, ראיון, נאום).</p>';
  m.promises.forEach(function(p){
    h+='<div class="card"><div>'+esc(p.text)+'</div><div class="mute">'+(p.topic?esc(p.topic)+' · ':'')+(p.sourceDate?esc(p.sourceDate)+' · ':'')+link(p.sourceUrl)+'</div><div>'+promiseChips(p)+'</div>'
     +'<label>סטטוס</label><select data-a="status" data-id="'+m.id+'" data-p="'+p.id+'">'+statusOpts().map(function(o){return'<option value="'+o[0]+'"'+(o[0]===p.status?' selected':'')+'>'+esc(o[1])+'</option>'}).join('')+'</select>'
     +(p.note?'<div class="mute" style="margin-top:6px">'+esc(p.note)+'</div>':'');
    (p.evidence||[]).forEach(function(e){
      h+='<div class="ev '+esc(e.effect)+'"><div>'+esc(e.title)+'</div><div class="mute">'+esc(e.type)+' · '+esc(EFFECT[e.effect]||'')+(e.date?' · '+esc(e.date):'')+' · '+link(e.url)+' <button class="lnk danger" data-a="delEv" data-id="'+m.id+'" data-p="'+p.id+'" data-e="'+e.id+'">מחיקה</button></div></div>'});
    h+='<div class="row" style="margin-top:8px"><button class="sec" data-a="addEv" data-id="'+m.id+'" data-p="'+p.id+'">+ ראיה</button><button class="lnk" data-a="editPromise" data-id="'+m.id+'" data-p="'+p.id+'">עריכה</button><button class="lnk danger" data-a="delPromise" data-id="'+m.id+'" data-p="'+p.id+'">מחיקה</button></div></div>'});
  h+='<div class="row"><h2 class="grow">פעילות ציבורית קודמת</h2><button class="sec" data-a="addBg" data-id="'+m.id+'">+ פריט</button></div>';
  h+='<p class="mute">תפקידים, פרסומים והצהרות פומביות שאפשר לקשר למקור. בלי פרטים פרטיים.</p>';
  m.background.forEach(function(b){
    h+='<div class="card"><div>'+esc(b.title)+'</div><div class="mute">'+(b.period?esc(b.period)+' · ':'')+link(b.url)+'</div>'+(b.note?'<div class="mute">'+esc(b.note)+'</div>':'')
     +'<button class="lnk danger" data-a="delBg" data-id="'+m.id+'" data-b="'+b.id+'">מחיקה</button></div>'});
  if(m.apiPersonId){
    h+='<div class="row"><h2 class="grow">הצעות חוק (מה-API)</h2><button class="sec" data-a="loadBills" data-id="'+m.id+'">טעינה</button></div>';
    (bills[m.id]||[]).forEach(function(b){
      h+='<div class="card"><div>'+esc(b.Name)+'</div><div class="mute">הכנסת ה-'+esc(b.KnessetNum)+' · '+esc(b.SubTypeDesc||'')+'</div><button class="lnk" data-a="billToPromise" data-id="'+m.id+'" data-b="'+b.BillID+'">שיוך להבטחה</button></div>'});
  }
  h+=cmtSection(m);
  h+='<div style="margin-top:24px"><button class="lnk danger" data-a="delMk" data-id="'+m.id+'">מחיקת חבר הכנסת</button></div>';
  return h;
}

/* ---------- committees (Knesset 25, window before the end of the term) ---------- */
var CMT_DEFAULT={from:'2026-04-27',to:'2026-10-27'};
function cmtWin(){return(S.cmt&&S.cmt.win)||CMT_DEFAULT}
function inWin(r,w){return(!r.s||r.s<=w.to)&&(!r.f||r.f>=w.from)}
function mkByPerson(pid){return S.mks.find(function(m){return m.apiPersonId===pid})}
function cmtName(id){var c=S.cmt&&S.cmt.committees.find(function(x){return x.id===id});return c?c.n:'ועדה '+id}
function sessionCounts(){var m={};((S.cmt&&S.cmt.sessions)||[]).forEach(function(s){m[s.c]=(m[s.c]||0)+1});return m}
function winRoles(){var w=cmtWin();return((S.cmt&&S.cmt.roles)||[]).filter(function(r){return inWin(r,w)})}
function loadCommittees(){
  var w=cmtWin(),pre=S.mks.some(function(m){return m.apiPersonId})?Promise.resolve():loadMembers(25);
  return pre.then(function(){
    toast('טוען ועדות וישיבות… זה יכול לקחת דקה');
    var from=w.from+'T00:00:00Z',to=w.to+'T23:59:59Z';
    return Promise.all([
      fetchAll(BASE+'KNS_Committee?$filter=KnessetNum eq 25&$select=CommitteeID,Name,CommitteeTypeDesc&$top=100',1000),
      fetchAll(BASE+'KNS_CommitteeSession?$filter=KnessetNum eq 25 and StartDate ge '+from+' and StartDate le '+to+'&$select=CommitteeSessionID,CommitteeID,StartDate,TypeDesc,SessionUrl&$top=100',20000),
      fetchAll(BASE+'KNS_PersonToPosition?$filter=KnessetNum eq 25 and CommitteeID ne null&$select=PersonID,CommitteeID,DutyDesc,StartDate,FinishDate&$top=100',20000)
    ]);
  }).then(function(r){
    S.cmt={win:w,loadedAt:new Date().toISOString(),
      committees:r[0].map(function(c){return{id:c.CommitteeID,n:c.Name,t:c.CommitteeTypeDesc||''}}),

var NATIVE=!!(window.Android&&window.Android.startBills);
function nbMeta(){try{var t=window.Android.billsMeta();return t?JSON.parse(t):null}catch(e){return null}}
function nbRows(skip){try{var t=window.Android.billsPage(skip);if(!t)return[];return(JSON.parse(t).value||[]).map(function(b){return{i:b.BillID,k:b.KnessetNum,n:b.Name||'',t:b.SubTypeDesc||''}})}catch(e){return[]}}
function nbRead(){var m=nbMeta();if(!m)return null;var rows=[],seen={};
  for(var s=0;s<m.nextSkip;s+=100)nbRows(s).forEach(function(r){if(!seen[r.i]){seen[r.i]=1;rows.push(r)}});
  return{knesset:m.knesset,rows:rows,nextSkip:m.nextSkip,done:m.done,loadedAt:m.loadedAt||''}}
var BL=NATIVE?nbRead():blRead(),blRun=false,blStop=false,BQ='';
window.__billsNative=function(state,skip,msg){
  if(!BL)return;
  if(state==='progress'){if(!blRun){blRun=true;render()}var seen={};BL.rows.forEach(function(r){seen[r.i]=1});
    nbRows(skip).forEach(function(r){if(!seen[r.i]){seen[r.i]=1;BL.rows.push(r)}});BL.nextSkip=skip+100;blProgress();return}
  blRun=false;var re=nbRead();if(re)BL=re;render();
  toast(state==='done'?'נטענו '+BL.rows.length+' הצעות חוק':state==='stopped'?'הטעינה נעצרה אחרי '+BL.rows.length+' הצעות. אפשר להמשיך.':'הטעינה נכשלה ('+msg+') אחרי '+BL.rows.length+' הצעות. אפשר להמשיך.')};
function nativeBills(knesset,fresh){
  var restart=!!fresh||!BL||BL.knesset!==knesset;
  if(restart)BL={knesset:knesset,rows:[],nextSkip:0,done:false,loadedAt:''};
  if(!window.Android.startBills(knesset||0,restart)){toast('הטעינה כבר רצה');return}
  blRun=true;BL.done=false;render();blProgress()}

function blProgress(){var el=document.getElementById('blProg');if(el&&BL)el.textContent='נטענו '+BL.rows.length+' הצעות · $skip='+BL.nextSkip}
function loadAllBills(knesset,fresh){
  if(blRun)return;
  if(NATIVE){nativeBills(knesset,fresh);return}
  if(fresh||!BL||BL.knesset!==knesset)BL={knesset:knesset,rows:[],nextSkip:0,done:false,loadedAt:''};
  var seen={},useOrder=true;BL.rows.forEach(function(r){seen[r.i]=1});
  blRun=true;blStop=false;BL.done=false;render();blProgress();
  function end(msg){blRun=false;BL.loadedAt=new Date().toISOString();blSave();render();toast(msg)}
  function page(){
    if(blStop)return end('הטעינה נעצרה אחרי '+BL.rows.length+' הצעות. אפשר להמשיך.');
    if(BL.nextSkip>=300000)return end('עצירת ביטחון ב-300,000 שורות');
    var url=BASE+'KNS_Bill?$skip='+BL.nextSkip+'&$top=100'+(useOrder?'&$orderby=BillID':'')+(BL.knesset?'&$filter=KnessetNum eq '+BL.knesset:'')+'&$select=BillID,KnessetNum,Name,SubTypeDesc';
    return getJson(url).then(function(j){
      var rows=j.value||[];
      if(!rows.length){BL.done=true;return end('נטענו '+BL.rows.length+' הצעות חוק')}
      rows.forEach(function(b){if(!seen[b.BillID]){seen[b.BillID]=1;BL.rows.push({i:b.BillID,k:b.KnessetNum,n:b.Name||'',t:b.SubTypeDesc||''})}});

      return new Promise(function(r){setTimeout(r,120)}).then(page);
    },function(e){
      if(useOrder&&BL.nextSkip===0&&!BL.rows.length){useOrder=false;return page()}
      end('הטעינה נכשלה ('+e.message+') אחרי '+BL.rows.length+' הצעות. אפשר להמשיך.');
    });
  }

}

function promiseForm(m,p){
  ask(p?'עריכת הבטחה':'הבטחה חדשה',[{k:'text',label:'נוסח ההבטחה',type:'textarea',value:p&&p.text,required:true},{k:'topic',label:'נושא',value:p&&p.topic},{k:'sourceUrl',label:'קישור למקור',type:'url',value:p&&p.sourceUrl,required:true},{k:'sourceDate',label:'תאריך המקור',type:'date',value:p&&p.sourceDate},{k:'election',label:'מערכת בחירות',type:'select',options:[['2022','בחירות 2022 (הכנסת ה-25)'],['2026','בחירות 2026 (הכנסת ה-26)'],['other','אחר']],value:p&&p.election?p.election:'2022'},{k:'war',label:'ההבטחה הושפעה מהמלחמה (מאז 7.10.2023)',type:'checkbox',value:p&&p.war},{k:'status',label:'סטטוס',type:'select',options:statusOpts(),value:p?p.status:'unchecked'},{k:'note',label:'הערה',type:'textarea',value:p&&p.note}]).then(function(o){
    if(!o)return;
    if(p){Object.assign(p,o)}else{o.id=uid();o.evidence=[];m.promises.push(o)}
    save();render()})}
function evForm(m,pid){
  ask('ראיה לפעילות',[{k:'title',label:'תיאור',required:true},{k:'type',label:'סוג',type:'select',options:EVTYPE.map(function(t){return[t,t]})},{k:'effect',label:'השפעה על ההבטחה',type:'select',options:[['support',EFFECT.support],['contradict',EFFECT.contradict],['context',EFFECT.context]]},{k:'date',label:'תאריך',type:'date'},{k:'url',label:'קישור למקור',type:'url',required:true}]).then(function(o){
    if(!o)return;var p=m.promises.find(function(x){return x.id===pid});o.id=uid();p.evidence=p.evidence||[];p.evidence.push(o);save();render()})}
function menu(){
  ask('גיבוי ושחזור',[{k:'act',label:'פעולה',type:'select',options:[['export','ייצוא / שיתוף הנתונים'],['import','ייבוא מקובץ JSON שהודבק'],['wipe','מחיקת כל הנתונים']]}],'המשך').then(function(o){
    if(!o)return;
    if(o.act==='export'){var t=JSON.stringify(Object.assign({},S,{cmt:undefined}),null,2);
      if(window.Android&&window.Android.shareText)window.Android.shareText(t);
      else if(navigator.share)navigator.share({title:'מעקב הבטחות',text:t}).catch(function(){});
      else{var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'application/json'}));a.download='mk-promises.json';a.click()}}
    else if(o.act==='import'){ask('הדביקו JSON',[{k:'json',label:'תוכן הגיבוי',type:'textarea',required:true}],'ייבוא').then(function(x){
      if(!x)return;try{var j=JSON.parse(x.json);if(!j||!Array.isArray(j.mks))throw 0;if(confirm('להחליף את הנתונים הנוכחיים?')){S=j;save();view={name:'list'};render()}}catch(e){toast('ה-JSON אינו תקין')}})}
    else if(o.act==='wipe'){if(confirm('למחוק הכול? אי אפשר לשחזר.')){S={v:1,mks:[]};save();try{localStorage.removeItem(BKEY)}catch(e){}if(NATIVE){try{window.Android.wipeBills()}catch(e){}}BL=null;view={name:'list'};render()}}})}

/* ---------- events ---------- */
document.addEventListener('click',function(ev){var t=ev.target.closest('[data-a]');if(!t||t.tagName==='SELECT')return;var f=A[t.dataset.a];if(f){f(t.dataset)}});
document.addEventListener('change',function(ev){var t=ev.target;
  if(t.dataset&&t.dataset.a==='status'){var p=mk(t.dataset.id).promises.find(function(x){return x.id===t.dataset.p});p.status=t.value;save();render();return}
  if(t.id==='fac'){F.faction=t.value;renderItems()}if(t.id==='onlyNew'){F.onlyNew=t.checked;renderItems()}});
document.addEventListener('input',function(ev){if(ev.target.id==='q'){F.q=ev.target.value;renderItems()}if(ev.target.id==='bq'){BQ=ev.target.value;renderBillItems()}});
function goBack(){
  if(view.name==='cmt'){view={name:'cmts'};render();return true}
  if(view.name==='mk'||view.name==='cmts'||view.name==='bills'){view={name:'list'};render();return true}
  return false}
document.getElementById('backBtn').addEventListener('click',goBack);
window.__back=goBack;
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){navigator.serviceWorker.register('sw.js').catch(function(){})}
render();
})();
</script>
